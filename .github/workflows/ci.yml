name: ci

on:
  push:
  pull_request:

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Cache fastembed model
        uses: actions/cache@v4
        with:
          path: .cache/fastembed
          key: fastembed-all-MiniLM-L6-v2-${{ hashFiles('requirements.txt') }}
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: pytest -q
      - name: Run evals
        run: python -m evals.run_evals
      - name: Regression gate (fails build if quality drops)
        run: python -m evals.compare
      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/results.json
